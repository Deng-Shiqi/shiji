    .focus-layout{display:grid;grid-template-columns:280px minmax(380px,1fr) 280px;min-height:710px}.side{padding:34px 26px;background:#f3f2ef}.side.left{border-right:1px solid var(--line)}.side.right{border-left:1px solid var(--line)}.section-label{display:block;margin:0 0 10px;color:#858681;font-size:.8rem;letter-spacing:.04em}.task-input{width:100%;height:48px;padding:0 14px;border:1px solid #d5d5d0;border-radius:12px;color:var(--ink);background:#fff;font-size:1rem}.task-input::placeholder{color:#aaa9a5}.space-top{margin-top:28px}.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.category{min-height:40px;padding:0 10px;border:1px solid #d8d8d3;border-radius:10px;background:transparent;color:#696a67}.category.active{border-color:#242628;color:#171719;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.05)}.category:before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--cat,#999)}.duration-pills{display:flex;flex-wrap:wrap;gap:7px}.duration-pills button{min-width:54px;height:36px;border:1px solid #d8d8d3;border-radius:9px;background:transparent;color:#666763}.duration-pills button.active{color:#fff;background:#292b2d;border-color:#292b2d}.hint{margin-top:13px;color:#9a9b96;font-size:.78rem;line-height:1.6}.focus-center{display:grid;place-items:center;padding:30px;background:radial-gradient(circle at center,#fff 0,#fff 33%,#f7f6f3 70%)}.timer-wrap{width:min(100%,470px);text-align:center}.timer-ring{position:relative;width:min(350px,78vw);aspect-ratio:1;margin:0 auto 28px}.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.timer-ring circle{fill:none;stroke-width:13}.ring-track{stroke:#e3e4e1}.ring-progress{stroke:var(--pink);stroke-linecap:round;transition:stroke-dashoffset .5s linear}.timer-copy{position:absolute;inset:0;display:grid;place-content:center}.clock{font-size:clamp(3.7rem,8vw,5.8rem);font-weight:760;letter-spacing:-.055em;font-variant-numeric:tabular-nums     .insights{width:min(980px,calc(100% - 48px));margin:0 auto;padding:30px 0 70px}.range-tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:5px;border-radius:13px;background:#ebebe8}.range-tabs button{height:42px;border:0;border-radius:10px;background:transparent;color:#737470;font-weight:650}.range-tabs button.active{color:#202124;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.07)}.period-nav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:74px;margin:16px 0 0;border-bottom:1px solid var(--line)}.period-nav button{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:#6e6f6b;font-size:1.8rem}.period-nav button:hover{background:#ededeb}.period-copy{text-align:center}.period-copy small{display:block;color:#8d8e89;margin-bottom:4px}.period-copy strong{font-size:1.1rem}.metric-card{margin-top:24px;padding:34px 38px;border:1px solid var(--line);border-radius:18px;background:#fff}.metric-label{color:#737470}.hero-metric{margin:9px 0 5px;font-size:clamp(2.4rem,6vw,4rem);line-height:1;letter-spacing:-.055em}.period-detail{color:#8e8f8b}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:36px}.metric-grid span{display:block;margin-bottom:7px;color:#8a8b87;font-size:.85rem}.metric-grid strong{font-size:1.45rem}.chart-card{margin-top:22px;padding:30px 30px 24px;border:1px solid var(--line);border-radius:18px;background:#fff}.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.chart-head h2{margin:0;font-size:1.05rem}.chart-legend{display:flex;gap:12px;color:#888985;font-size:.75rem}.chart-legend i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:2px}.bar-chart{height:310px;display:flex;align-items:stretch;gap:clamp(4px,1.2vw,14px);padding:16px 4px 0;border-bottom:1px solid #e4e4df;background-image:linear-gradient(#ecece8 1px,transparent 1px);background-size:100% 25%}.bar-column{min-width:0;flex:1;display:flex;fle     @media(max-width:980px){.focus-layout{grid-template-columns:230px 1fr}.side.right{grid-column:1/-1;border:0;border-top:1px solid var(--line)}.recent-list{grid-template-columns:repeat(3,1fr)}.nav button{min-width:104px;padding:0 14px}.local-badge,.traffic{width:90px}}@media(max-width:720px){body{background:var(--window)}.app{width:100%;min-height:100vh;margin:0;border:0;border-radius:0;box-shadow:none;padding-bottom:70px}.titlebar{height:58px;justify-content:space-between;padding:0 16px}.traffic,.local-badge{display:none}.brand{display:block}.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;height:66px;justify-content:space-around;border-top:1px solid var(--line);background:rgba(250,250,248,.96);backdrop-filter:blur(16px)}.nav button{flex:1;min-width:0;padding:0 4px;font-size:.78rem}.nav button.active:after{top:0;bottom:auto;left:24%;right:24%;border-radius:0 0 3px 3px}.focus-layout{display:flex;flex-direction:column}.side.left{order:2;border:0;border-top:1px solid var(--line)}.focus-center{order:1;min-height:540px;padding:24px 16px}.side.right{order:3}.recent-list{grid-template-columns:1fr}.subpage,.insights,.preferences{width:min(100% - 28px,940px);padding-top:24px}.metric-card{padding:26px 22px}.metric-grid{grid-template-columns:1fr 1fr}.timeline-item{grid-template-columns:72px 4px minmax(0,1fr) auto;gap:10px;padding:10px}.timeline-duration{grid-column:3}.delete-button{grid-column:4;grid-row:1/span 2}.chart-card{padding:22px 12px 18px}.bar-chart{gap:3px}.bar-stack{width:80%}.distribution-grid{grid-template-columns:repeat(12,1fr)}.setting{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
  <main class="app"><header class="titlebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand">时迹</div><nav class="nav" aria-label="主导航"><button class="active" data-page="focus">专注</button><button data-page="timeline">时间轴</button><button data-page="insights">数据洞察</button><button data-page="preferences">偏好</button></nav><div class="local-badge">本地保存</div></header>
    <div class="content">
      <section class="page active" id="focusPage"><div class="focus-layout">
        <aside class="side left"><label class="section-label" for="taskInput">专注事件</label><input class="task-input" id="taskInput" maxlength="80" autocomplete="off" placeholder="现在要做什么？"><span class="section-label space-top">分类</span><div class="category-grid"><button class="category active" data-category="工作" style="--cat:#4385ee">工作</button><button class="category" data-category="学习" style="--cat:#efb1c2">学习</button><button class="category" data-category="创作" style="--cat:#cbb0df">创作</button><button class="category" data-category="生活" style="--cat:#67b690">生活</button></div><span class="section-label space-top">倒计时</span><div class="duration-pills"><button data-minutes="25" class="active">25</button><button data-minutes="45">45</button><button data-minutes="60">60</button><button data-minutes="0">正计时</button></div><p class="hint">倒计时结束后不会自动保存，继续累计超时时间，直到你手动停止。</p></aside>
        <div class="focus-center"><div class="timer-wrap"><div class="timer-ring"><svg viewBox="0 0 360 360" aria-hidden="true"><circle class="ring-track" cx="180" cy="180" r="164"></circle><circle class="ring-progress" id="ringProgress" cx="180" cy="180" r="164"></circle></svg><div class="timer-copy"><div class="clock" id="clock">25:00</div><div class="current-task" id="currentTask">准备专注</div><div class="timer-state" id="timerState">25 分钟倒计时</div></div></div><div class="controls" id="controls"><button class="round-button start" id="startButton">开始</button></div></div></div>
        <aside class="side right"><div class="recent-title"><h2>今天</h2><span id="todayDate"></span></div><div class="recent-list" id="recentList"></div><div class="today-total"><span class="section-label">今日专注</span><strong id="todayTotal">0 分钟</strong></div></aside>
      </div></section>
      <section class="page" id="timelinePage"><div class="subpage"><div class="page-title"><div><h1>时间轴</h1><p>每一次开始和停止，都会留下一条清晰记录。</p></div><button class="ghost-button" id="jumpToday">回到今天</button></div><div class="timeline-list" id="timelineList"></div></div></section>
      <section class="page" id="insightsPage"><div class="insights"><div class="range-tabs" id="rangeTabs"><button class="active" data-range="day">日</button><button data-range="week">周</button><button data-range="month">月</button><button data-range="year">年</button></div><div class="period-nav"><button id="periodPrev" aria-label="上一周期">‹</button><div class="period-copy"><small id="periodKind">今天</small><strong id="periodLabel"></strong></div><button id="periodNext" aria-label="下一周期">›</button></div><div class="metric-card"><div class="metric-label">专注时间</div><h1 class="hero-metric" id="focusMetric">0 分钟</h1><div class="period-detail" id="periodDetail"></div><div class="metric-grid"><div><span>专注次数</span><strong id="sessionMetric">0 次</strong></div><div><span id="averageLabel">平均时长</span><strong id="averageMetric">0 分钟</strong></div><div><span>活跃天数</span><strong id="activeMetric">0 天</strong></div><div><span>最长专注</span><strong id="longestMetric">0 分钟</strong></div></div></div><div class="chart-card"><div class="chart-head"><h2 id="chartTitle">专注时间分布</h2><div class="chart-legend"><span><i style="background:var(--blue)"></i>工作</span><span><i style="background:var(--pink)"></i>学习</span><span><i style="background:var(--purple)"></i>创作</span></div></div><div id="chart"></div></div></div></section>
      <section class="page" id="preferencesPage"><div class="preferences"><div class="page-title"><div><h1>偏好</h1><p>保持简单，只调整真正影响使用的选项。</p></div></div><div class="settings-card"><div class="setting"><div><strong>默认倒计时</strong><span>每次打开时默认选中的专注时长</span></div><select class="select" id="defaultDuration"><option value="25">25 分钟</option><option value="45">45 分钟</option><option value="60">60 分钟</option><option value="0">正计时</option></select></div><div class="setting"><div><strong>导出记录</strong><span>用 CSV 打开查看，或用 JSON 完整备份</span></div><div><button class="ghost-button" id="exportCsv">CSV</button> <button class="ghost-button" id="exportJson">JSON</button></div></div><div class="setting"><div><strong class="danger">清空所有记录</strong><span>计时记录会从当前浏览器永久删除</span></div><button class="ghost-button danger" id="clearData">清空</button></div></div></div></section>
    </div>
  </main><div class="toast" id="toast" role="status"></div>
  <script>
  (()=>{
    const STORAGE_KEY='shiji.sessions.v1',ACTIVE_KEY='shiji.active.v1',PREF_KEY='shiji.preferences.v1';const colors={工作:'#4385ee',学习:'#efb1c2',创作:'#cbb0df',生活:'#67b690',其他:'#aaa9a5'};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let sessions=load(STORAGE_KEY,[]),active=normalizeActive(load(ACTIVE_KEY,null)),prefs=load(PREF_KEY,{defaultDuration:25});let selectedCategory='工作',selectedMinutes=Number(prefs.defaultDuration??25),range='day',anchor=new Date(),timerId,clearArmed=false;const circumference=2*Math.PI*164;$('#ringProgress').style.strokeDasharray=String(circumference);
    function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function normalizeActive(a){if(!a)return null;if(a.mode)return a;return{...a,mode:'free',targetMs:0,accumulatedMs:0,runningSince:a.startedAt,paused:false}}function saveSessions(){localStorage.setItem(STORAGE_KEY,JSON.stringify(sessions))}function saveActive(){active?localStorage.setItem(ACTIVE_KEY,JSON.stringify(active)):localStorage.removeItem(ACTIVE_KEY)}function dayKey(v=Date.now()){const d=new Date(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function esc(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}function elapsed(){if(!active)return 0;return active.accumulatedMs+(active.paused?0:Date.now()-active.runningSince)}function fmtClock(ms,hours=false){let sec=Math.max(0,Math.floor(ms/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h||hours?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function fmtDuration(ms,seconds=false){if(!ms)return'0 分钟';const totalSec=Math.max(1,Math.round(ms/1000)),h=Math.floor(totalSec/3600),m=Math.floor(totalSec%3600/60),s=totalSec%60;if(seconds&&h)return`${h} 小时 ${m} 分钟 ${s} 秒`;if(seconds&&m<3)return`${m} 分钟 ${s} 秒`;if(h)return`${h} 小时${m?' '+m+' 分钟':''}`;return`${Math.max(1,m)} 分钟`}function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
    function startTimer(name,category=selectedCategory,minutes=selectedMinutes){const clean=String(name||'').trim().slice(0,80);if(!clean)throw new Error('请先填写专注事件');if(active)throw new Error('已有事件正在计时');const now=Date.now();active={id:crypto.randomUUID?.()||String(now),name:clean,category,startedAt:now,mode:Number(minutes)===0?'free':'countdown',targetMs:Number(minutes)*60000,accumulatedMs:0,runningSince:now,paused:false};saveActive();renderAll();return{id:active.id,name:clean,category}}function togglePause(){if(!active)return;if(active.paused){active.runningSince=Date.now();active.paused=false}else{active.accumulatedMs+=Date.now()-active.runningSince;active.paused=true}saveActive();renderTimer()}function stopTimer(){if(!active)throw new Error('当前没有正在计时的事件');const duration=Math.max(1000,elapsed()),endedAt=Date.now(),row={id:active.id,name:active.name,category:active.category,startedAt:active.startedAt,endedAt,duration};sessions.unshift(row);saveSessions();active=null;saveActive();$('#taskInput').value='';renderAll();return row}
    function handleStart(){try{startTimer($('#taskInput').value)}catch(e){toast(e.message)}}
    function renderTimer(){clearInterval(timerId);const p=$('#ringProgress');if(!active){const target=selectedMinutes*60000;$('#clock').textContent=selectedMinutes?fmtClock(target):'00:00';$('#currentTask').textContent='准备专注';$('#timerState').textContent=selectedMinutes?`${selectedMinutes} 分钟倒计时`:'自由正计时';p.style.strokeDashoffset=String(selectedMinutes?0:circumference);$('#taskInput').disabled=false;$$('.category,.duration-pills button').forEach(b=>b.disabled=false);$('#controls').innerHTML='<button class="round-button start" id="startButton">开始</button>';$('#startButton').onclick=handleStart;return}$('#taskInput').value=active.name;$('#taskInput').disabled=true;$$('.category,.duration-pills button').forEach(b=>b.disabled=true);const update=()=>{const e=elapsed();if(active.mode==='countdown'){const rem=active.targetMs-e,over=rem<0;$('#clock').textContent=(over?'+':'')+fmtClock(Math.abs(rem),Math.abs(rem)>=3600000);$('#timerState').textContent=over?'已超时 · 手动停止后保存':active.paused?'已暂停':`${Math.ceil(rem/60000)} 分钟后结束`;p.style.strokeDashoffset=String(circumference*Math.min(1,e/active.targetMs))}else{$('#clock').textContent=fmtClock(e,e>=3600000);$('#timerState').textContent=active.paused?'已暂停':'自由正计时';p.style.strokeDashoffset=String(circumference)}$('#currentTask').textContent=active.name};update();if(!active.paused)timerId=setInterval(update,1000);$('#controls').innerHTML=`<button class="round-button" id="pauseButton" aria-label="${active.paused?'继续':'暂停'}"><svg viewBox="0 0 24 24"><path d="${active.paused?'M8 5v14l11-7z':'M6 5h4v14H6zm8 0h4v14h-4z'}"/></svg></button><button class="round-button stop" id="stopButton" aria-label="停止并保存"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>`;$('#pauseButton').onclick=togglePause;$('#stopButton').onclick=()=>{const r=stopTimer();toast(`已保存 · ${fmtDuration(r.duration)}`)}}
    function renderFocusSide(){const today=sessions.filter(s=>dayKey(s.startedAt)===dayKey()),root=$('#recentList');$('#todayDate').textContent=new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});root.innerHTML='';if(!today.length)root.innerHTML='<div class="empty-small">今天还没有记录。完成第一次专注后，会显示在这里。</div>';today.slice(0,5).forEach(s=>{const d=document.createElement('div');d.className='recent-item';d.innerHTML=`<div class="recent-row"><i class="recent-dot" style="background:${colors[s.category]||colors.其他}"></i><span class="recent-name">${esc(s.name)}</span></div><div class="recent-time">${new Date(s.startedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}–${new Date(s.endedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · ${fmtDuration(s.duration)}</div>`;root.append(d)});$('#todayTotal').textContent=fmtDuration(today.reduce((a,s)=>a+s.duration,0))}
    function renderTimeline(){const root=$('#timelineList');root.innerHTML='';if(!sessions.length){root.innerHTML='<div class="empty-card">还没有记录。去“专注”开始第一件事。</div>';return}sessions.slice(0,100).forEach(s=>{const row=document.createElement('div'),st=new Date(s.startedAt),et=new Date(s.endedAt);row.className='timeline-item';row.innerHTML=`<div class="timeline-clock">${st.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}<br>${et.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div><div class="timeline-color" style="background:${colors[s.category]||colors.其他}"></div><div class="timeline-main"><strong>${esc(s.name)}</strong><span>${esc(s.category)} · ${st.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})}</span></div><div class="timeline-duration">${fmtDuration(s.duration)}</div><button class="delete-button" aria-label="删除记录">×</button>`;row.querySelector('button').onclick=()=>{sessions=sessions.filter(x=>x.id!==s.id);saveSessions();renderAll();toast('记录已删除')};root.append(row)})}
    function weekStart(d){const x=startOfDay(d),day=x.getDay()||7;return addDays(x,1-day)}function bounds(){let start,end,label,kind;if(range==='day'){start=startOfDay(anchor);end=addDays(start,1);kind=dayKey(start)===dayKey()?'今天':start.toLocaleDateString('zh-CN',{weekday:'long'});label=start.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}else if(range==='week'){start=weekStart(anchor);end=addDays(start,7);kind='本周';label=`${start.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})} – ${addDays(end,-1).toLocaleDateString('zh-CN',{month:'long',day:'numeric'})}`}else if(range==='month'){start=new Date(anchor.getFullYear(),anchor.getMonth(),1);end=new Date(anchor.getFullYear(),anchor.getMonth()+1,1);kind='本月';label=start.toLocaleDateString('zh-CN',{year:'numeric',month:'long'})}else{start=new Date(anchor.getFullYear(),0,1);end=new Date(anchor.getFullYear()+1,0,1);kind='本年';label=`${anchor.getFullYear()} 年`}return{start,end,label,kind}}function periodSessions(){const b=bounds();return sessions.filter(s=>s.startedAt>=b.start.getTime()&&s.startedAt<b.end.getTime())}function shiftPeriod(n){if(range==='day')anchor=addDays(anchor,n);if(range==='week')anchor=addDays(anchor,n*7);if(range==='month')anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1);if(range==='year')anchor=new Date(anchor.getFullYear()+n,0,1);renderInsights()}
    function bucketData(list){const b=bounds(),cats=Object.keys(colors),items=[];if(range==='day')for(let h=0;h<24;h++)items.push({label:String(h).padStart(2,'0'),start:new Date(b.start.getFullYear(),b.start.getMonth(),b.start.getDate(),h).getTime(),end:new Date(b.start.getFullYear(),b.start.getMonth(),b.start.getDate(),h+1).getTime()});if(range==='week')for(let i=0;i<7;i++){const d=addDays(b.start,i);items.push({label:['周日','周一','周二','周三','周四','周五','周六'][d.getDay()],start:d.getTime(),end:addDays(d,1).getTime()})}if(range==='month'){const count=new Date(b.start.getFullYear(),b.start.getMonth()+1,0).getDate();for(let i=0;i<count;i++){const d=addDays(b.start,i);items.push({label:String(i+1),start:d.getTime(),end:addDays(d,1).getTime()})}}if(range==='year')for(let i=0;i<12;i++){const d=new Date(b.start.getFullYear(),i,1);items.push({label:`${i+1}月`,start:d.getTime(),end:new Date(b.start.getFullYear(),i+1,1).getTime()})}return items.map(it=>{const sums={};cats.forEach(c=>sums[c]=0);list.filter(s=>s.startedAt>=it.start&&s.startedAt<it.end).forEach(s=>sums[s.category in colors?s.category:'其他']+=s.duration);return{...it,sums,total:Object.values(sums).reduce((a,v)=>a+v,0)}})}
    function renderChart(list){const root=$('#chart'),data=bucketData(list),max=Math.max(...data.map(x=>x.total),1);root.innerHTML='';if(range==='day'){root.className='distribution-grid';data.forEach(x=>{const el=document.createElement('div'),top=Object.entries(x.sums).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]).slice(0,3);el.className='hour-cell';if(!top.length)top.push(['其他',0]);el.title=`${x.label}:00 · ${fmtDuration(x.total)}`;el.innerHTML=top.map(([c,v])=>`<i class="hour-piece ${v?'used':''}" style="background:${colors[c]}"></i>`).join('')+`<span class="hour-label">${Number(x.label)%3===0?x.label:''}</span>`;root.append(el)});return}root.className='bar-chart';const sparse=range==='month'&&data.length>16;data.forEach((x,i)=>{const col=document.createElement('div'),h=Math.max(2,x.total/max*248),parts=Object.entries(x.sums).filter(([,v])=>v);col.className='bar-column';col.innerHTML=`<span class="bar-value">${fmtDuration(x.total)}</span><div class="bar-stack" style="height:${h}px">${parts.length?parts.map(([c,v])=>`<i class="bar-piece" style="height:${v/x.total*100}%;background:${colors[c]}"></i>`).join(''):'<i class="bar-piece" style="height:2px;background:#deded9"></i>'}</div><span class="bar-label">${sparse&&i%5!==0?'':x.label}</span>`;root.append(col)})}
    function renderInsights(){const b=bounds(),list=periodSessions(),total=list.reduce((a,s)=>a+s.duration,0),days=new Set(list.map(s=>dayKey(s.startedAt))).size,longest=Math.max(0,...list.map(s=>s.duration));$('#periodKind').textContent=b.kind;$('#periodLabel').textContent=b.label;$('#periodDetail').textContent=b.label;$('#focusMetric').textContent=fmtDuration(total,range==='day');$('#sessionMetric').textContent=`${list.length} 次`;$('#averageMetric').textContent=fmtDuration(list.length?total/list.length:0);$('#activeMetric').textContent=`${days} 天`;$('#longestMetric').textContent=fmtDuration(longest);$('#averageLabel').textContent=range==='day'?'平均时长':'日均时长';$('#chartTitle').textContent=range==='day'?'专注时间分布':range==='week'?'每周专注分布':range==='month'?'每月专注分布':'全年专注分布';renderChart(list)}function renderAll(){renderTimer();renderFocusSide();renderTimeline();renderInsights()}
    $$('.nav button').forEach(btn=>btn.onclick=()=>{$$('.nav button').forEach(x=>x.classList.toggle('active',x===btn));$$('.page').forEach(x=>x.classList.remove('active'));$(`#${btn.dataset.page}Page`).classList.add('active');if(btn.dataset.page==='insights')renderInsights()});$$('.category').forEach(btn=>btn.onclick=()=>{selectedCategory=btn.dataset.category;$$('.category').forEach(x=>x.classList.toggle('active',x===btn));$('#ringProgress').style.stroke=colors[selectedCategory]});$$('.duration-pills button').forEach(btn=>btn.onclick=()=>{selectedMinutes=Number(btn.dataset.minutes);$$('.duration-pills button').forEach(x=>x.classList.toggle('active',x===btn));renderTimer()});$$('#rangeTabs button').forEach(btn=>btn.onclick=()=>{range=btn.dataset.range;anchor=new Date();$$('#rangeTabs button').forEach(x=>x.classList.toggle('active',x===btn));renderInsights()});$('#periodPrev').onclick=()=>shiftPeriod(-1);$('#periodNext').onclick=()=>shiftPeriod(1);$('#jumpToday').onclick=()=>$$('.nav button')[0].click();$('#defaultDuration').value=String(prefs.defaultDuration??25);$('#defaultDuration').onchange=e=>{prefs.defaultDuration=Number(e.target.value);localStorage.setItem(PREF_KEY,JSON.stringify(prefs));if(!active){selectedMinutes=prefs.defaultDuration;$$('.duration-pills button').forEach(x=>x.classList.toggle('active',Number(x.dataset.minutes)===selectedMinutes));renderTimer()}toast('偏好已保存')};
    function download(name,type,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#exportJson').onclick=()=>{download(`时迹备份-${dayKey()}.json`,'application/json',JSON.stringify({version:2,exportedAt:new Date().toISOString(),sessions},null,2));toast('JSON 备份已生成')};$('#exportCsv').onclick=()=>{const q=v=>'"'+String(v).replaceAll('"','""')+'"',rows=[['任务','分类','开始时间','结束时间','分钟'],...sessions.map(s=>[s.name,s.category,new Date(s.startedAt).toLocaleString('zh-CN'),new Date(s.endedAt).toLocaleString('zh-CN'),Math.round(s.duration/60000)])];download(`时迹记录-${dayKey()}.csv`,'text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'));toast('CSV 已生成')};$('#clearData').onclick=()=>{if(!clearArmed){clearArmed=true;$('#clearData').textContent='再次点击确认';toast('再次点击以确认清空');setTimeout(()=>{clearArmed=false;$('#clearData').textContent='清空'},4000);return}sessions=[];saveSessions();clearArmed=false;$('#clearData').textContent='清空';renderAll();toast('所有记录已清空')};
    if(document.modelContext?.registerTool)[{name:'start_task_timer',title:'开始专注',description:'用任务名称、分类和可选倒计时分钟数开始专注。',inputSchema:{type:'object',properties:{name:{type:'string'},category:{type:'string',enum:['工作','学习','创作','生活','其他']},minutes:{type:'number',minimum:0,maximum:480}},required:['name'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({name,category,minutes})=>startTimer(name,category||'工作',minutes??25)},{name:'pause_or_resume_timer',title:'暂停或继续专注',description:'切换当前专注计时器的暂停状态。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{if(!active)throw new Error('没有正在计时的事件');togglePause();return{paused:active.paused}}},{name:'stop_task_timer',title:'停止并保存',description:'停止当前专注事件并保存实际用时。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{const r=stopTimer();return{id:r.id,name:r.name,durationSeconds:Math.round(r.duration/1000)}}},{name:'read_time_summary',title:'读取专注汇总',description:'读取今天和本月的专注时间及次数。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>{const today=sessions.filter(s=>dayKey(s.startedAt)===dayKey()),now=new Date(),month=sessions.filter(s=>{const d=new Date(s.startedAt);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()});return{todayMinutes:Math.round(today.reduce((a,s)=>a+s.duration,0)/60000),todaySessions:today.length,monthMinutes:Math.round(month.reduce((a,s)=>a+s.duration,0)/60000),monthSessions:month.length}}}].forEach(tool=>{try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch{}});
    $('#ringProgress').style.stroke=colors[selectedCategory];renderAll();
  })();
  </script>
