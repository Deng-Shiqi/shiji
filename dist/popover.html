<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light;--ink:#222326;--muted:#8c8d89;--track:#e2e3df;--accent:#efb1c2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;color:var(--ink)}body{position:relative;isolation:isolate;padding:9px 14px 12px;background:rgba(249,249,247,.97)}button,input,select{font:inherit}.toolbar{position:relative;z-index:30;height:24px;display:flex;justify-content:flex-end;gap:3px}.tool{width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:#62635f;font-size:15px;cursor:pointer}.tool:hover,.tool.active{background:#e9e9e5;color:#202124}.ring{position:relative;z-index:1;width:174px;height:174px;margin:2px auto 5px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}circle{fill:none;stroke-width:11}.track{stroke:var(--track)}.progress{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s linear}.center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.clock{font-size:41px;font-weight:780;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums}.task{margin-top:7px;max-width:144px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#62635f;font-size:12px}.state{margin-top:3px;color:#a0a19c;font-size:10px}.setup{position:relative;z-index:40;display:grid;grid-template-columns:minmax(0,1fr) 86px;gap:7px;margin:3px 0 3px}.setup input,.setup select{position:relative;z-index:41;width:100%;min-width:0;height:34px;border:1px solid #d6d6d1;border-radius:9px;background:#fff;color:var(--ink);font-size:13px}.setup input{-webkit-appearance:none;appearance:none;padding:0 10px;line-height:32px;vertical-align:middle}.setup input::placeholder{line-height:32px}.setup select{padding:0 8px;line-height:normal}.setup input:focus,.setup select:focus{outline:3px solid rgba(67,133,238,.28);outline-offset:1px}.controls{position:relative;z-index:2;display:flex;justify-content:center;gap:48px}.round{width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;background:#303233;color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.14);cursor:pointer}.round svg{width:21px;height:21px;fill:currentColor}.start{width:128px;height:44px;border-radius:23px;font-weight:700}.foot{display:none}
  </style>
</head>
<body>
  <div class="toolbar"><button class="tool" id="settings" title="打开完整界面">⚙︎</button><button class="tool" id="pin" title="保持显示">♧</button><button class="tool" id="close" title="关闭小窗">×</button><button class="tool" id="quit" title="退出时迹">⏻</button></div>
  <div class="setup" id="setup"><input id="name" maxlength="80" placeholder="现在要做什么？"><select id="minutes"><option value="25">25 分钟</option><option value="45">45 分钟</option><option value="60">60 分钟</option><option value="0">正计时</option></select></div>
  <div class="ring"><svg viewBox="0 0 300 300"><circle class="track" cx="150" cy="150" r="137"></circle><circle class="progress" id="progress" cx="150" cy="150" r="137"></circle></svg><div class="center"><div class="clock" id="clock">25:00</div><div class="task" id="task">准备专注</div><div class="state" id="state">25 分钟倒计时</div></div></div>
  <div class="controls" id="controls"><button class="round start" id="start">开始</button></div><div class="foot">记录只保存在这台 Mac</div>
  <script>
    const ACTIVE_KEY='shiji.active.v1',STORAGE_KEY='shiji.sessions.v1',circ=2*Math.PI*137,$=s=>document.querySelector(s);let active=load(ACTIVE_KEY,null),pinned=false,timer;$('#progress').style.strokeDasharray=String(circ);
    function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function bridge(action,value){window.webkit?.messageHandlers?.shiji?.postMessage({action,value})}function elapsed(){if(!active)return 0;return active.accumulatedMs+(active.paused?0:Date.now()-active.runningSince)}function clock(ms,hours=false){const n=Math.max(0,Math.floor(ms/1000)),h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h||hours?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function save(){active?localStorage.setItem(ACTIVE_KEY,JSON.stringify(active)):localStorage.removeItem(ACTIVE_KEY)}
    function render(){clearInterval(timer);if(!active){const mins=Number($('#minutes').value),value=mins?clock(mins*60000):'00:00';$('#clock').textContent=value;$('#task').textContent='准备专注';$('#state').textContent=mins?`${mins} 分钟倒计时`:'自由正计时';$('#progress').style.strokeDashoffset=mins?0:circ;$('#setup').style.display='grid';$('#controls').innerHTML='<button class="round start" id="start">开始</button>';$('#start').onclick=start;bridge('tick',value);return}$('#setup').style.display='none';const update=()=>{const e=elapsed();let value;if(active.mode==='countdown'){const rem=active.targetMs-e,over=rem<0;value=(over?'+':'')+clock(Math.abs(rem),Math.abs(rem)>=3600000);$('#state').textContent=over?'已超时 · 停止后保存':active.paused?'已暂停':`${Math.ceil(rem/60000)} 分钟后结束`;$('#progress').style.strokeDashoffset=String(circ*Math.min(1,e/active.targetMs))}else{value=clock(e,e>=3600000);$('#state').textContent=active.paused?'已暂停':'自由正计时';$('#progress').style.strokeDashoffset=circ}$('#clock').textContent=value;$('#task').textContent=active.name;bridge('tick',value)};update();if(!active.paused)timer=setInterval(update,1000);$('#controls').innerHTML=`<button class="round" id="pause" title="${active.paused?'继续':'暂停'}"><svg viewBox="0 0 24 24"><path d="${active.paused?'M8 5v14l11-7z':'M6 5h4v14H6zm8 0h4v14h-4z'}"/></svg></button><button class="round" id="stop" title="停止并保存"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>`;$('#pause').onclick=pause;$('#stop').onclick=stop}
    function start(){const name=$('#name').value.trim();if(!name){$('#name').focus();return}const mins=Number($('#minutes').value),now=Date.now();active={id:crypto.randomUUID?.()||String(now),name,category:'工作',startedAt:now,mode:mins?'countdown':'free',targetMs:mins*60000,accumulatedMs:0,runningSince:now,paused:false};save();render()}function pause(){if(active.paused){active.runningSince=Date.now();active.paused=false}else{active.accumulatedMs+=Date.now()-active.runningSince;active.paused=true}save();render()}function stop(){const end=Date.now(),duration=Math.max(1000,elapsed()),rows=load(STORAGE_KEY,[]);rows.unshift({id:active.id,name:active.name,category:active.category,startedAt:active.startedAt,endedAt:end,duration});localStorage.setItem(STORAGE_KEY,JSON.stringify(rows));active=null;save();$('#name').value='';render()}
    $('#minutes').onchange=render;$('#settings').onclick=()=>bridge('openMain');$('#pin').onclick=()=>{pinned=!pinned;$('#pin').classList.toggle('active',pinned);bridge('pin',pinned)};$('#close').onclick=()=>bridge('close');$('#quit').onclick=()=>bridge('quit');render();
  </script>
</body>
</html>
